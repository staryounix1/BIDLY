services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bidly
      POSTGRES_PASSWORD: bidly_local_pw
      POSTGRES_DB: bidly
    ports:
      - "55432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bidly -d bidly"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://bidly:bidly_local_pw@db:5432/bidly
      DATABASE_SSL: "false"
      API_PORT: "4000"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on: [api]

volumes:
  dbdata:
